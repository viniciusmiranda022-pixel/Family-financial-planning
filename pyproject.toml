[project]
name = "family-financial-planning"
version = "0.2.0"
description = "Sistema financeiro familiar on-premises, auditável e orientado a documentos"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44,<50",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "faster-whisper>=1.1,<2",
  "pdfplumber>=0.11,<1",
  "pillow>=11,<13",
  "pillow-heif>=0.21,<2",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pydantic-settings>=2.7,<3",
  "pytesseract>=0.3.13,<1",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # FastAPI intentionally uses dependency factories in parameter defaults.
  "B008",
  # Long endpoint signatures are clearer than artificial wrapping here.
  "E501",
]
