name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

# CI is intentionally PR-centric to preserve the repository's limited monthly
# GitHub-hosted runner allowance. The final executable PR head must still pass
# all 12 gates before merge; main is not run a second time automatically after
# that successful validation. Use workflow_dispatch for exceptional direct-main
# validation. See docs/CI_POLICY.md.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Fake, fixed test-only credentials -- never used outside CI, matching the
# same "clearly fake" convention tests/test_api.py already established for
# its own process. Present at the workflow level (not just inside `pytest
# -q`) because several jobs below run one focused subset of test files as
# its own named gate (docs/INTEGRITY_IMPLEMENTATION_PLAN.md section 18):
# some of those files construct `sqlite:///:memory:` engines and import
# `app.db` without setting these themselves (they rely on `tests/test_api.py`
# happening to import first when the *whole* suite runs together), so
# running them standalone -- deliberately, to get a distinctly-named
# required check per dimension -- needs the settings available up front.
env:
  SECRET_KEY: ci-only-secret-never-used-outside-github-actions-aaaa
  FILE_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .

  unit:
    # The full suite, SQLite-backed: the safety-net superset every other
    # gate below is a focused, separately-required subset of. Keeping this
    # job is deliberate -- a regression outside every named dimension below
    # (there is no dimension for e.g. Smart Capture or the plan workbook
    # importer) must still fail CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  financial-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_financial_invariants.py

  property-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_property_based_financial_rules.py

  parser-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_reconciliation.py tests/test_duplicates.py tests/test_importer.py

  projection-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_finance.py tests/test_financial_engine.py tests/test_integrity_engine.py

  snapshot-channel-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_financial_snapshots.py tests/test_monthly_close.py tests/test_monthly_close_api.py

  advisor-contract-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_codex_audit.py tests/test_audit_sanitizer.py tests/test_codex_client.py
      - run: node --check advisor/server.mjs
      - run: node --check advisor/audit.mjs
      - run: node --check advisor/schema-validate.mjs
      - run: node --check advisor/providers/fakeProvider.mjs
      - name: Advisor unit tests (sanitizer/allowlist, fake provider, prompt injection)
        working-directory: advisor
        run: npm test

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check app/static/app.js
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @(
            "scripts/setup-codex-windows.ps1",
            "scripts/run-codex-advisor.ps1",
            "scripts/setup-tailscale.ps1",
            "scripts/disable-tailscale-proxy.ps1",
            "scripts/lib/TailscaleProxy.psm1",
            "tests/tailscale_proxy/run_tests.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      # docs/WORK_ORDER_AUTOMATED_HTTPS_PROXY.md: behavioral coverage for
      # the automated Tailscale Serve proxy (prerequisite fail-closed
      # checks, idempotent apply, drift rejection, Funnel/foreign-port
      # rejection, rollback, no hardcoded secret/non-loopback IP). Runs
      # here -- the existing PowerShell-scripts gate -- rather than as a
      # new named job, to keep this a 12-gate CI (docs/ROADMAP.md,
      # README.md) instead of introducing a 13th. Uses an in-memory fake
      # Tailscale CLI plus a real loopback HTTP listener: no tailnet,
      # credential, or external network access, per the Work Order's
      # testing constraints.
      - name: Tailscale proxy automation tests
        shell: pwsh
        run: ./tests/tailscale_proxy/run_tests.ps1

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t family-financial-planning:test .
      - run: docker build -t family-financial-advisor:test advisor
      - run: cp .env.example .env && docker compose config -q

  # docs/INTEGRITY_IMPLEMENTATION_PLAN.md section 17.5 / PR 8 Work Order
  # scope item 1: PostgreSQL/Alembic must run for real in CI, not only
  # SQLite. Both jobs below provision the identical production-compatible
  # service (postgres:17-alpine, matching compose.yaml) and run
  # tests/test_postgresql_integration.py, split into two named, separately
  # required gates: migrations (upgrade/downgrade), and everything else in
  # that file (backfill, initial-load) below. The second job intentionally
  # excludes by name rather than including by name: an earlier version used
  # `-k "backfill"`, which silently stopped covering the initial-load
  # PostgreSQL test added later because its name doesn't contain
  # "backfill" -- excluding the migration job's own tests instead means a
  # new test added to this file lands in the second job by default instead
  # of needing its keyword added here.
  alembic-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_finance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://family:family@localhost:5432/family_finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Empty-database upgrade, legacy-baseline upgrade, downgrade
        run: pytest -q tests/test_postgresql_integration.py -k "upgrade or downgrade"

  integration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: family_finance
          POSTGRES_USER: family
          POSTGRES_PASSWORD: family
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U family -d family_finance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://family:family@localhost:5432/family_finance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - name: Backfill and initial-load idempotency/non-mutation against real PostgreSQL locking
        run: pytest -q tests/test_postgresql_integration.py -k "not (upgrade or downgrade)"
