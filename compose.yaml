name: family-financial-planning

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - document_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [internal, lan]

  advisor:
    build: ./advisor
    restart: unless-stopped
    environment:
      ADVISOR_SHARED_SECRET: ${ADVISOR_SHARED_SECRET:-}
      CODEX_HOME: /codex-auth
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-70000}
    volumes:
      - codex_auth:/codex-auth
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=16m,mode=755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [lan]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks: [internal]

networks:
  internal:
    internal: true
  lan:

volumes:
  postgres_data:
  document_data:
  backup_data:
  codex_auth:
