name: family-financial-planning

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - document_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks: [internal, lan]

  # MAIL-03 (docs/WORK_ORDER_DUE_DATE_EMAIL_ALERTS.md, issue #70): the
  # due-date e-mail alert worker as its own restart-safe service, reusing
  # the `app` image/entrypoint with `command: ["worker"]` (see
  # `scripts/entrypoint.sh`) instead of a second Dockerfile. `depends_on:
  # app: condition: service_healthy` guarantees migrations (0022 included)
  # have already run before this starts -- this service never runs
  # `alembic upgrade head` itself. Networks mirror `app`'s own
  # (`internal` for PostgreSQL, `lan` for outbound SMTP to Gmail); no
  # `ports:` and no `document_data` volume, since the worker never serves
  # HTTP and never touches a document. `cap_drop: [ALL]` beyond `app`'s
  # own hardening: unlike `app`, this process never needs to bind a
  # listening port, so it needs no Linux capability at all. See
  # `docs/RUNBOOK_MAIL_ALERTS.md` for operating/troubleshooting this
  # service and `app/cli/notification_worker_healthcheck.py` for what the
  # healthcheck actually probes.
  notification-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "app.cli.notification_worker_healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks: [internal, lan]

  advisor:
    profiles: ["container-advisor"]
    build: ./advisor
    restart: unless-stopped
    environment:
      ADVISOR_SHARED_SECRET: ${ADVISOR_SHARED_SECRET:-}
      CODEX_HOME: /codex-auth
      ADVISOR_SANDBOX_DIR: /sandbox
      CODEX_MODEL: ${CODEX_MODEL:-}
      CODEX_TIMEOUT_MS: ${CODEX_TIMEOUT_MS:-70000}
    volumes:
      - codex_auth:/codex-auth
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=16m,mode=755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [lan]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks: [internal]

networks:
  internal:
    internal: true
  lan:

volumes:
  postgres_data:
  document_data:
  backup_data:
  codex_auth:
